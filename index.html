<!DOCTYPE html>
<!--
  ¡Hola! Este archivo es TODO en uno: HTML (estructura), CSS (estilos) y JS (comportamiento).
  Está pensado para que aprendas leyendo los comentarios. Ábrelo con doble clic
  y se va a abrir en tu navegador (Chrome, Edge, etc). Luego haz clic sobre
  cualquier texto de la página para editarlo directamente.
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- charset UTF-8 = permite usar tildes y ñ sin que se vean caracteres raros -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Esto hace que la página se vea bien también en celulares -->

  <title>Mi Portafolio</title>
  <!-- Este texto aparece en la pestaña del navegador -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================================================
       HTML: aquí está el CONTENIDO de la página
       ============================================================ -->

  <p class="aviso">✏️ Haz clic sobre cualquier texto para editarlo. Haz clic en el círculo para subir tu foto.</p>

  <!-- .hero = el "marco" grande de tu boceto -->
  <div class="hero">

    <!-- Fila de arriba: foto + textos -->
    <div class="top-row">

      <!-- 
        La imagen de perfil. La usamos como <img>, pero al inicio
        no tiene foto real, por eso mostramos un texto "Imagen" encima.
        El JS de más abajo se encarga de cambiarla cuando subes un archivo.
      -->
      <div>
        <img
          id="fotoPerfil"
          class="profile-pic profile-pic-placeholder"
          src=""
          alt="Foto de perfil"
        />
        <!-- 
          Este input es el que realmente abre el explorador de archivos.
          Lo escondimos con CSS (display:none) y usamos la etiqueta
          <label> de abajo como botón bonito que lo activa.
        -->
        <input type="file" id="fotoInput" accept="image/*" />
        <label for="fotoInput" class="btn-subir-foto">Subir foto</label>
      </div>

      <!-- 
        contenteditable="true" es la magia que pediste: convierte
        estos elementos en editables con solo hacer clic, sin backend.
      -->
      <div>
        <div class="titulo-principal" contenteditable="true">Tu Nombre Aquí</div>
        <div class="subtitulo" contenteditable="true">Desarrollador de Software</div>
      </div>
    </div>

    <!-- Caja de descripción, igual que el rectángulo "Descripcion" de tu boceto -->
    <div class="descripcion" contenteditable="true">
      Escribe aquí una breve descripción sobre ti: quién eres, qué haces,
      tus intereses o tu experiencia. Haz clic para editar este texto.
    </div>

    <!-- Los 3 "Enlace Modificable" de tu boceto -->
    <div class="enlaces">
      <a href="#" class="enlace" contenteditable="true">LinkedIn</a>
      <a href="#" class="enlace" contenteditable="true">GitHub</a>
      <a href="#" class="enlace" contenteditable="true">Correo</a>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
